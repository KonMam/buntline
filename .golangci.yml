version: "2"

linters:
  default: standard
  enable:
    - misspell
    - unconvert
    - unparam
  settings:
    errcheck:
      exclude-functions:
        # Fire-and-forget writes where failure is already handled or moot.
        - (*encoding/json.Encoder).Encode
        - fmt.Fprintf

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
