# Example Compose stack for running buntline on a home server behind a
# reverse proxy. See docs/docker.md.
services:
  buntline:
    image: ghcr.io/konmam/buntline:latest
    container_name: buntline
    environment:
      # Hostname the UI is served under, for the DNS-rebinding guard.
      BUNTLINE_ALLOWED_HOSTS: buntline.example.com
      # Default provider. Alternatively, configure providers in the UI
      # or in ./data/.config/buntline/config.toml.
      BUNTLINE_BASE_URL: https://api.deepseek.com/v1
      BUNTLINE_MODEL: deepseek-chat
      BUNTLINE_API_KEY: ${DEEPSEEK_API_KEY}
    volumes:
      - ./data:/data # config, secrets, sessions
      - ./workspace:/workspace # what the agent works on
    restart: unless-stopped
    networks:
      - proxy

networks:
  proxy:
    external: true
