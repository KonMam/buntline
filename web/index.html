    <!-- PWA-lite: the manifest makes "Add to Home Screen" work, which is
         the only way iOS Safari (16.4+) surfaces native notifications;
         it also gives the mobile app its own icon and standalone mode.
         No service worker: the notification stream lives while the app
         is open, so none is needed for this scope. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#0f0f10" />
